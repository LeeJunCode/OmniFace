# OmniFace 默认配置

# 分析后端：openface | onnx | gaze | none
analysis_backend: openface

model:
  detector_model: "models/buffalo_sc/det_500m.onnx"
  recognizer_model: "models/buffalo_sc/w600k_mbf.onnx"
  reference_image: ""
  detection_threads: 4
  recognition_threads: 4
  detection_input_width: 640
  detection_input_height: 640
  min_face_area: 0.0
  recognition_confidence_threshold: 0.0
  recognition_iou: 0.3
  openface_model_dir: "openface_model"
  device: cpu

thresholds:
  match_threshold: 0.30
  detection_confidence: 0.5
  detection_nms: 0.4
  tracking_high: 0.5
  tracking_match: 0.4
  tracking_match_second: 0.5
  tracking_new: 0.7

behavior:
  ema_alpha: 0.7
  max_frame_width: 0
  target_recheck_interval: 0

# ---- OpenFace 分析配置 ----------------------------------------
openface:
  profile: standard          # standard | max_quality

  # 可选逐字段覆盖（注释掉则使用 profile 默认值）：
  # model_file: main_ceclm_general.txt
  # sigma: 1.25
  # reg_factor: 35.0
  # weight_factor: 2.5
  # optimise_iterations: 10
  # use_face_template: true
  # face_template_scale: 0.5
  # validate_detections: true
  # validation_boundary: 0.725
  # refine_hierarchical: true
  # refine_parameters: true
  # multi_view_first_frame: true
  # reinit_video_every: 2
  # limit_pose: true
  # window_sizes_small: [0, 9, 7, 0]
  # window_sizes_init: [11, 9, 7, 5]

video:
  input_path: ""
  output_path: ""

# ---- ONNX 分析配置（MediaPipe FaceMesh） ---------------------------
onnx:
  enable_pose: true
  enable_au: false         # 预留给 OpenGprahAU
  landmark_model: "models/mediapipe/face_mesh_Nx3x192x192_post.onnx"
  canonical_model: "models/mediapipe/canonical_face_model.obj"
  analysis_threads: 1
  margin: 0.25
  score_threshold: 0.95
  realtime_display: true
  draw_landmarks: true
  draw_face_wireframe: true
  draw_face_normal: true
  device: cpu

# ---- L2CS-Net 视线估计（选择 "gaze" 后端启用） --------------------
gaze:
  model: "mobilenetv2_gaze.onnx"
  draw_gaze: true
  device: cpu

# ---- MEFARG AU 分析（选择 "mefarg_au" 后端启用） ----------------
mefarg_au:
  model: "models/OpenGprahAU/mefarg_resnet18_au.onnx"
  intra_threads: 1
  threshold: 0.5
  device: cpu

log:
  level: "debug"
